<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>The Inversion Cosmology</title>
    <style>
        /* Reset and Base */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', serif;
            overflow: hidden; /* Prevents body from scrolling */
            touch-action: pan-y; /* Forces vertical swipe recognition */
        }

        /* The Isolated Scroll Container (This does the scrolling) */
        #scroll-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow-y: scroll;
            overflow-x: hidden;
            z-index: 1;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* The Tall Spacer (drives the scrollbar) */
        #journey {
            width: 100%;
            height: 600vh; /* 6 screens tall */
            position: relative;
            z-index: 1;
        }

        /* The Fixed Visual Container (Always on screen) */
        #viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 2;
            pointer-events: none; /* Lets swipes pass through to the scroll container */
        }

        /* The Breathing Universe Wrapper */
        #breathing-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: breathe 12s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* The Nested Layers (Images) */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(0.5);
            will-change: transform, opacity;
        }

        .layer.active {
            opacity: 1;
            transform: scale(1);
        }

        /* The White Light God Position */
        #god-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        /* The Text Iterations */
        .iteration-text {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            text-align: center;
            font-size: 1.5rem;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 5;
            pointer-events: none;
        }

        .iteration-text.visible {
            opacity: 1;
        }

        /* Hide scrollbar for a cleaner cinematic feel */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- The Visuals (Fixed) -->
    <div id="viewport">
        <div id="breathing-wrapper">
            <img id="layer1" class="layer active" src="inverse1.webp" alt="Layer 1">
            <img id="layer2" class="layer" src="inverse2.webp" alt="Layer 2">
            <img id="layer3" class="layer" src="inverse3.webp" alt="Layer 3">
            <img id="layer4" class="layer" src="inverse4.webp" alt="Layer 4">
        </div>
    </div>

    <!-- The Text Iterations -->
    <div id="text1" class="iteration-text">
        "Gravity is not a pull. It is the Earth rising to meet your feet."
    </div>
    <div id="text2" class="iteration-text">
        "Time is an iteration. Every moment, reality recalculates."
    </div>
    <div id="text3" class="iteration-text">
        "Up is not outward. It is inward. We are already in heaven."
    </div>
    <div id="text4" class="iteration-text">
        "The center is infinitely far away. The closer you get, the larger the universe becomes."
    </div>

    <!-- The Final Light -->
    <div id="god-light"></div>
    <div id="text5" class="iteration-text" style="color: #333; text-shadow: none; font-size: 2rem; top: 50%; bottom: auto; transform: translate(-50%, -50%); opacity: 0; transition: opacity 3s ease;">
        Be still.
    </div>

    <!-- The Scrolling Space -->
    <div id="scroll-container">
        <div id="journey"></div>
    </div>

    <script>
        // Get the actual scrolling container
        const scrollContainer = document.getElementById('scroll-container');
        const layers = [
            document.getElementById('layer1'),
            document.getElementById('layer2'),
            document.getElementById('layer3'),
            document.getElementById('layer4')
        ];
        const texts = [
            document.getElementById('text1'),
            document.getElementById('text2'),
            document.getElementById('text3'),
            document.getElementById('text4'),
            document.getElementById('text5')
        ];
        const godLight = document.getElementById('god-light');

        // Listen to the scroll event on the container
        scrollContainer.addEventListener('scroll', () => {
            const scrollTop = scrollContainer.scrollTop;
            const scrollHeight = scrollContainer.scrollHeight - scrollContainer.clientHeight;
            
            // Avoid division by zero
            if (scrollHeight <= 0) return;
            
            let progress = scrollTop / scrollHeight;
            if (progress < 0) progress = 0;
            if (progress > 1) progress = 1;

            // --- Text Fading Logic ---
            texts.forEach((text, index) => {
                let textStart = (index * 0.2) + 0.05;
                let textEnd = (index * 0.2) + 0.15;
                
                if (progress >= textStart && progress <= textEnd) {
                    text.classList.add('visible');
                } else if (index === 4 && progress > 0.85) {
                    text.classList.add('visible');
                } else {
                    text.classList.remove('visible');
                }
            });

            // --- Layer Transition Logic (Triggered earlier for mobile) ---
            if (progress < 0.15) {
                // Pure Layer 1
                setLayer(0, 1, 0);
            } else if (progress < 0.35) {
                // Transition 1 -> 2
                let p = (progress - 0.15) / 0.2;
                setLayer(0, 1 - p, p);
            } else if (progress < 0.55) {
                // Transition 2 -> 3
                let p = (progress - 0.35) / 0.2;
                setLayer(1, 1 - p, p);
            } else if (progress < 0.75) {
                // Transition 3 -> 4
                let p = (progress - 0.55) / 0.2;
                setLayer(2, 1 - p, p);
            } else if (progress < 0.85) {
                // Pure Layer 4
                setLayer(3, 1, 0);
            } else {
                // Dissolve to God Light (0.85 to 1.0)
                let p = (progress - 0.85) / 0.15;
                layers[3].style.opacity = 1 - p;
                godLight.style.opacity = p;
            }
        });

        // Helper function to manage opacities and scales
        function setLayer(activeIndex, fadeOutAmount, fadeInAmount) {
            layers.forEach((layer, index) => {
                if (index === activeIndex) {
                    layer.style.opacity = fadeOutAmount;
                    let scale = 1 + (1 - fadeOutAmount) * 1.5;
                    layer.style.transform = `scale(${scale})`;
                } else if (index === activeIndex + 1) {
                    layer.style.opacity = fadeInAmount;
                    let scale = 0.5 + fadeInAmount * 0.5;
                    layer.style.transform = `scale(${scale})`;
                } else {
                    layer.style.opacity = 0;
                }
            });
        }
    </script>
</body>
</html>
