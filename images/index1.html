<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Inversion Cosmology</title>
    <style>
        /* Reset and Base */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', serif;
            overflow-x: hidden;
        }

        /* The Scrollable Space */
        #journey {
            width: 100%;
            height: 600vh; /* 6 screens tall to allow slow scrolling */
            position: relative;
            z-index: 1;
            -webkit-overflow-scrolling: touch; /* FIX: Enables smooth physical scrolling on mobile/tablet */
        }

        /* The Fixed Visual Container */
        #viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            z-index: 2;
            pointer-events: none; /* FIX: Lets your finger pass through to the scroll behind it */
        }

        /* The Breathing Universe Wrapper */
        #breathing-wrapper {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            animation: breathe 12s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); } /* Subtle 3% breath */
        }

        /* The Nested Layers (Images) */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scale(0.5); /* Start small, zoom in */
            will-change: transform, opacity;
        }

        .layer.active {
            opacity: 1;
            transform: scale(1);
        }

        /* The White Light God Position */
        #god-light {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fff;
            opacity: 0;
            z-index: 10;
            pointer-events: none;
            transition: opacity 2s ease;
        }

        /* The Text Iterations */
        .iteration-text {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            text-align: center;
            font-size: 1.5rem;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 5;
            pointer-events: none;
        }

        .iteration-text.visible {
            opacity: 1;
        }

        /* Hide scrollbar for a cleaner cinematic feel */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body>

    <!-- The Visuals (Fixed) -->
    <div id="viewport">
        <div id="breathing-wrapper">
            <img id="layer1" class="layer active" src="inverse1.webp" alt="Layer 1">
            <img id="layer2" class="layer" src="inverse2.webp" alt="Layer 2">
            <img id="layer3" class="layer" src="inverse3.webp" alt="Layer 3">
            <img id="layer4" class="layer" src="inverse4.webp" alt="Layer 4">
        </div>
    </div>

    <!-- The Text Iterations -->
    <div id="text1" class="iteration-text">
        "Gravity is not a pull. It is the Earth rising to meet your feet."
    </div>
    <div id="text2" class="iteration-text">
        "Time is an iteration. Every moment, reality recalculates."
    </div>
    <div id="text3" class="iteration-text">
        "Up is not outward. It is inward. We are already in heaven."
    </div>
    <div id="text4" class="iteration-text">
        "The center is infinitely far away. The closer you get, the larger the universe becomes."
    </div>

    <!-- The Final Light -->
    <div id="god-light"></div>
    <div id="text5" class="iteration-text" style="color: #333; text-shadow: none; font-size: 2rem; top: 50%; bottom: auto; transform: translate(-50%, -50%); opacity: 0; transition: opacity 3s ease;">
        Be still.
    </div>

    <!-- The Journey Space (Scrollable) -->
    <div id="journey"></div>

    <script>
        const layers = [
            document.getElementById('layer1'),
            document.getElementById('layer2'),
            document.getElementById('layer3'),
            document.getElementById('layer4')
        ];

        const texts = [
            document.getElementById('text1'),
            document.getElementById('text2'),
            document.getElementById('text3'),
            document.getElementById('text4'),
            document.getElementById('text5')
        ];

        const godLight = document.getElementById('god-light');
        const journey = document.getElementById('journey');

        // Calculate breakpoints based on scroll
        // 0-20%: Layer 1
        // 20-40%: Transition 1 to 2
        // 40-60%: Transition 2 to 3
        // 60-80%: Transition 3 to 4
        // 80-100%: Dissolve to Light

        window.addEventListener('scroll', () => {
            const scrollTop = window.scrollY;
            const scrollHeight = journey.scrollHeight - window.innerHeight;
            let progress = scrollTop / scrollHeight;
            
            // Clamp progress between 0 and 1
            if (progress < 0) progress = 0;
            if (progress > 1) progress = 1;

            // Text Fading Logic
            texts.forEach((text, index) => {
                // Show text roughly in the middle of its corresponding section
                let textStart = (index * 0.2) + 0.05;
                let textEnd = (index * 0.2) + 0.15;
                
                if (progress >= textStart && progress <= textEnd) {
                    text.classList.add('visible');
                } else if (index === 4 && progress > 0.85) {
                    // Special handling for "Be still"
                    text.classList.add('visible');
                } else {
                    text.classList.remove('visible');
                }
            });

            // Layer Transition Logic
            if (progress < 0.2) {
                // Pure Layer 1
                setLayer(0, 1, 0); 
            } else if (progress < 0.4) {
                // Transition 1 -> 2
                let p = (progress - 0.2) / 0.2; // 0 to 1
                setLayer(0, 1 - p, p); // Fade out 1, fade in 2
            } else if (progress < 0.6) {
                // Transition 2 -> 3
                let p = (progress - 0.4) / 0.2;
                setLayer(1, 1 - p, p);
            } else if (progress < 0.8) {
                // Transition 3 -> 4
                let p = (progress - 0.6) / 0.2;
                setLayer(2, 1 - p, p);
            } else if (progress < 0.85) {
                // Pure Layer 4
                setLayer(3, 1, 0);
            } else {
                // Dissolve to God Light (0.85 to 1.0)
                let p = (progress - 0.85) / 0.15;
                layers[3].style.opacity = 1 - p;
                godLight.style.opacity = p;
            }
        });

        // Helper function to manage opacities and scales
        function setLayer(activeIndex, fadeOutAmount, fadeInAmount) {
            layers.forEach((layer, index) => {
                if (index === activeIndex) {
                    // Currently fading out
                    layer.style.opacity = fadeOutAmount;
                    // Scale up as it fades out (zooming through)
                    let scale = 1 + (1 - fadeOutAmount) * 1.5; 
                    layer.style.transform = `scale(${scale})`;
                } else if (index === activeIndex + 1) {
                    // Currently fading in
                    layer.style.opacity = fadeInAmount;
                    // Scale from small to normal as it fades in
                    let scale = 0.5 + fadeInAmount * 0.5; 
                    layer.style.transform = `scale(${scale})`;
                } else {
                    // Hidden
                    layer.style.opacity = 0;
                }
            });
        }
    </script>
</body>
</html>
