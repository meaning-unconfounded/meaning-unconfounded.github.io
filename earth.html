<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carousel Test — Fixed</title>
  <style>
    /* ── Reset ── */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: Georgia, serif;
      padding: 2rem 1rem;
    }

    h1 {
      color: #d4af37;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
    }

    .subtitle {
      color: rgba(212, 175, 55, 0.4);
      font-style: italic;
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    /* ── CAROUSEL ── */
    .univers-carousel {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 16px;
      background: #0a0a1a;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
    }

    .univers-track {
      display: flex;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }

    .univers-slide {
      flex: 0 0 100%;          /* Each slide takes exactly 100% of container width */
      min-width: 0;            /* Prevents overflow */
      aspect-ratio: 16 / 9;    /* Fixed frame – you can change this */
      background: #0a0a1a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .univers-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;    /* Shows full image, no cropping */
      display: block;
      background: #0a0a1a;
    }

    /* ── Buttons ── */
    .univers-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 1.8rem;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      transition: all 0.3s ease;
      user-select: none;
    }

    .univers-btn:hover {
      background: rgba(212, 175, 55, 0.25);
      border-color: #d4af37;
      color: #d4af37;
    }

    .univers-btn.prev {
      left: 16px;
    }
    .univers-btn.next {
      right: 16px;
    }

    /* ── Dots ── */
    .univers-dots {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .univers-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .univers-dot.active {
      background: #d4af37;
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.5);
      transform: scale(1.25);
    }

    .univers-dot:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* ── Status ── */
    .status {
      margin-top: 1.2rem;
      color: rgba(212, 175, 55, 0.3);
      font-size: 0.85rem;
      font-family: monospace;
      letter-spacing: 0.1em;
    }

    .status span {
      color: #d4af37;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .univers-btn {
        width: 36px;
        height: 36px;
        font-size: 1.2rem;
      }
      .univers-btn.prev {
        left: 8px;
      }
      .univers-btn.next {
        right: 8px;
      }
      .univers-dots {
        gap: 8px;
      }
      .univers-dot {
        width: 8px;
        height: 8px;
      }
      h1 {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <h1>✦ Cosmic Egg ✦</h1>
  <p class="subtitle">The Inversion — Four Views</p>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!--  CAROUSEL                                                    -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <div class="univers-carousel" id="universCarousel">
    <div class="univers-track" id="universTrack">
      <div class="univers-slide">
        <img src="/images/inverse1.webp" alt="The Shell" loading="lazy" />
      </div>
      <div class="univers-slide">
        <img src="/images/inverse2.webp" alt="The Spiral" loading="lazy" />
      </div>
      <div class="univers-slide">
        <img src="/images/inverse3.webp" alt="The Fractal" loading="lazy" />
      </div>
      <div class="univers-slide">
        <img src="/images/inverse4.webp" alt="The Source" loading="lazy" />
      </div>
    </div>

    <button class="univers-btn prev" id="prevBtn">‹</button>
    <button class="univers-btn next" id="nextBtn">›</button>

    <div class="univers-dots" id="dotsContainer">
      <span class="univers-dot active" data-index="0"></span>
      <span class="univers-dot" data-index="1"></span>
      <span class="univers-dot" data-index="2"></span>
      <span class="univers-dot" data-index="3"></span>
    </div>
  </div>

  <div class="status">
    Slide <span id="currentSlide">1</span> / <span id="totalSlides">4</span> &nbsp;·&nbsp; Autoplay every 5s
  </div>

  <!-- ═══════════════════════════════════════════════════════════════ -->
  <!--  JAVASCRIPT – Self-contained                                 -->
  <!-- ═══════════════════════════════════════════════════════════════ -->
  <script>
    (function() {
      'use strict';

      const track = document.getElementById('universTrack');
      const slides = track.querySelectorAll('.univers-slide');
      const dots = document.querySelectorAll('.univers-dot');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const currentSlideDisplay = document.getElementById('currentSlide');
      const totalSlidesDisplay = document.getElementById('totalSlides');

      let currentIndex = 0;
      const total = slides.length;
      let autoplayInterval;

      if (totalSlidesDisplay) {
        totalSlidesDisplay.textContent = total;
      }

      function goTo(index) {
        if (index < 0) index = total - 1;
        if (index >= total) index = 0;
        currentIndex = index;
        track.style.transform = 'translateX(-' + (currentIndex * 100) + '%)';

        dots.forEach(function(dot, i) {
          dot.classList.toggle('active', i === currentIndex);
        });

        if (currentSlideDisplay) {
          currentSlideDisplay.textContent = currentIndex + 1;
        }
      }

      function nextSlide() { goTo(currentIndex + 1); }
      function prevSlide() { goTo(currentIndex - 1); }

      // ── Events ──
      prevBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        resetAutoplay();
        prevSlide();
      });

      nextBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        resetAutoplay();
        nextSlide();
      });

      dots.forEach(function(dot) {
        dot.addEventListener('click', function(e) {
          e.stopPropagation();
          resetAutoplay();
          goTo(parseInt(this.dataset.index));
        });
      });

      // ── Keyboard ──
      document.addEventListener('keydown', function(e) {
        const carousel = document.getElementById('universCarousel');
        const rect = carousel.getBoundingClientRect();
        const isVisible = rect.top < window.innerHeight && rect.bottom > 0;
        if (!isVisible) return;

        if (e.key === 'ArrowRight') {
          e.preventDefault();
          resetAutoplay();
          nextSlide();
        }
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          resetAutoplay();
          prevSlide();
        }
      });

      // ── Touch ──
      let touchStartX = 0;
      const container = document.getElementById('universCarousel');

      container.addEventListener('touchstart', function(e) {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      container.addEventListener('touchend', function(e) {
        const diff = touchStartX - e.changedTouches[0].screenX;
        if (Math.abs(diff) > 40) {
          resetAutoplay();
          if (diff > 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });

      // ── Autoplay ──
      function startAutoplay() {
        if (autoplayInterval) clearInterval(autoplayInterval);
        autoplayInterval = setInterval(nextSlide, 5000);
      }

      function resetAutoplay() {
        clearInterval(autoplayInterval);
        startAutoplay();
      }

      container.addEventListener('mouseenter', function() {
        clearInterval(autoplayInterval);
      });

      container.addEventListener('mouseleave', function() {
        startAutoplay();
      });

      // ── Start ──
      goTo(0);
      startAutoplay();

      console.log('✅ Carousel initialised');
      console.log('   Slides:', total);
      console.log('   Images:', Array.from(slides).map(function(s) {
        return s.querySelector('img').src;
      }));

    })();
  </script>

</body>
</html>
